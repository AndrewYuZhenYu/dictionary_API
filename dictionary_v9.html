    // ======== 核心：流式请求逻辑 ========
    async function analyzeWord() {
        const apiKey = getApiKey();
        const rawWord = document.getElementById('wordInput').value;
        const searchBtn = document.getElementById('searchBtn');
        const resultDiv = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        // 1. 校验 API Key
        if (!apiKey) {
            showStatus('⚠️ 请先展开"接口密钥设置"并保存 API 密钥', 'error');
            if (!document.getElementById('apiKeySection').classList.contains('expanded')) {
                expandApiSection();
            }
            shakeElement(document.getElementById('apiKey'));
            return;
        }

        // 2. 校验输入内容
        const validation = validateInput(rawWord);
        if (!validation.valid) {
            showStatus(`⚠️ ${validation.error}`, 'error');
            shakeElement(document.getElementById('wordInput'));
            return;
        }
        const isChineseInput = validation.isChinese === true;
        const word = isChineseInput ? validation.cleaned : validation.cleaned.toLowerCase();
        document.getElementById('wordInput').value = word;

        // 3. 检查本地缓存
        const cachedHtml = localStorage.getItem(STORAGE_KEYS.WORD_CACHE_PREFIX + word);
        if (cachedHtml) {
            showStatus('⚡ 命中本地语料库，已秒开！', 'success');
            resultContent.innerHTML = cachedHtml;
            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            addHistory(word, cachedHtml);
            makeWordsClickable(resultContent);
            buildTOC();
            pushNavState(word, cachedHtml);
            setTimeout(hideStatus, 1500);
            return;
        }

        // 4. 准备网络请求
        if (abortController) {
            abortController.abort();
        }
        abortController = new AbortController();

        searchBtn.disabled = true;
        resultDiv.style.display = 'block';
        resultContent.innerHTML = '<h2 style="text-align:center; color: var(--text-muted); font-size: 1.2em;">正在连接 AI 引擎...<span class="cursor-blink"></span></h2>';
        showStatus('🚀 正在流式生成...', 'loading');
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`,
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        { role: 'system', content: buildSystemPrompt(word, isChineseInput) },
                        { role: 'user', content: word },
                    ],
                    temperature: 0.2,
                    max_tokens: 8192,
                    stream: true
                }),
                signal: abortController.signal,
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                const errMsg = errData.error?.message || '';
                if (response.status === 401) throw new Error('API Key 无效或已过期，请检查密钥');
                else if (response.status === 429) throw new Error('请求过于频繁，请稍后再试');
                else if (response.status === 402) throw new Error('账户余额不足，请充值');
                else throw new Error(errMsg || `HTTP 错误代码: ${response.status}`);
            }

            // 5. 流式解析（带防抖渲染，避免每个 token 都触发完整 parse）
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let markdownAcc = "";
            let fluffStripped = false;
            let pendingRender = false;
            let lastRenderTime = 0;
            const RENDER_INTERVAL_MS = 80;
            let lineBuffer = "";
            let streamFinished = false;  // 备选完成信号：检测到 finish_reason 后强制收尾
            let renderTimer = null;      // 【新增】保存定时器ID

            const doRender = function() {
                try {
                    pendingRender = false;
                    lastRenderTime = performance.now();
                    const cleaned = fixMarkdownHeadings(collapseRepeatedLines(markdownAcc));
                    let htmlHtml = marked.parse(cleaned);
                    htmlHtml = applyExamTags(htmlHtml);
                    htmlHtml = applyTitleColors(htmlHtml);
                    resultContent.innerHTML = htmlHtml + '<span class="cursor-blink"></span>';
                } catch (e) {
                    console.warn('Render chunk failed, skipping:', e.message);
                    // 渲染失败时不清除 pendingRender 导致后续渲染被跳过，
                    // 上面已重置 pendingRender=false，下次 scheduleRender 会重试
                }
            };

            const scheduleRender = function() {
                if (pendingRender) return;
                const now = performance.now();
                const elapsed = now - lastRenderTime;
                if (elapsed >= RENDER_INTERVAL_MS) {
                    doRender();
                } else {
                    pendingRender = true;
                    const delay = RENDER_INTERVAL_MS - elapsed;
                    renderTimer = setTimeout(function() {
                        try { doRender(); } catch (e) { console.warn('Deferred render failed:', e.message); }
                    }, delay);
                }
            };

            // 处理单条 SSE 数据行
            const processSSELine = function(trimmedLine) {
                if (!trimmedLine.startsWith('data:')) return;
                const dataPart = trimmedLine.substring(5).trim();
                // 多种 [DONE] 格式兼容
                if (!dataPart) return;
                const upper = dataPart.toUpperCase();
                if (upper === '[DONE]') {
                    streamFinished = true;
                    return;
                }

                try {
                    const data = JSON.parse(dataPart);
                    const delta = data.choices[0]?.delta?.content;
                    const finishReason = data.choices[0]?.finish_reason;

                    if (delta) {
                        markdownAcc += delta;

                        if (!fluffStripped && markdownAcc.length > 15) {
                            const stripped = stripOpeningFluff(markdownAcc);
                            if (stripped !== markdownAcc) {
                                markdownAcc = stripped;
                            }
                            fluffStripped = true;
                        }

                        scheduleRender();
                    }

                    // 备选完成检测：API 返回 finish_reason 但 [DONE] 可能因网络分片丢失
                    if (finishReason && (finishReason === 'stop' || finishReason === 'length')) {
                        streamFinished = true;
                    }
                } catch (e) {
                    // JSON 不完整（跨 chunk 边界），忽略
                }
            };

            // 安全超时：60 秒无新数据 → 强制收尾
            let safetyTimer = setTimeout(function() {
                streamFinished = true;
                if (abortController) abortController.abort();
            }, 60000);

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        streamFinished = true;  // 流自然关闭
                        break;
                    }

                    // 重置超时
                    clearTimeout(safetyTimer);
                    safetyTimer = setTimeout(function() {
                        streamFinished = true;
                        if (abortController) abortController.abort();
                    }, 60000);

                    const chunk = decoder.decode(value, { stream: true });
                    const text = lineBuffer + chunk;
                    const lines = text.split('\n');
                    lineBuffer = lines.pop() || "";

                    for (let i = 0; i < lines.length; i++) {
                        processSSELine(lines[i].trim());
                    }

                    // 【新增代码】：检查逻辑层面是否已经收到完成信号
                    if (streamFinished) {
                        // 逻辑已结束，但物理连接未断。主动切断底层请求，防止资源挂起
                        if (abortController) {
                            abortController.abort();
                        }
                        break; // 跳出 while(true) 死循环
                    }
                }
            } catch (e) {
                // 如果是主动 abort 引起的错误，忽略即可，因为它属于正常收尾
                if (e.name !== 'AbortError') throw e;
            } finally {
                clearTimeout(safetyTimer);
            }

            // 兜底：处理缓冲区残留的末行（含可能被截断的 [DONE]）
            if (lineBuffer.trim()) {
                processSSELine(lineBuffer.trim());
            }
// 【新增】：杀掉排队中的延迟渲染，防止覆盖清理好的 DOM
            if (renderTimer) clearTimeout(renderTimer);

            // 最终渲染：确保最后一次内容被渲染且光标被移除
            if (pendingRender) doRender();

            // 6. 完成：移除光标，存入缓存，使单词可点击
            // 用 DOM 方式移除光标 span（比字符串 replace 更可靠）
            const cursorSpan = resultContent.querySelector('.cursor-blink');
            if (cursorSpan) cursorSpan.remove();
            let finalHtml = resultContent.innerHTML;

            hideStatus();
            addHistory(word, finalHtml);
            makeWordsClickable(resultContent);
            buildTOC();
            pushNavState(word, finalHtml);

        } catch (error) {
            if (error.name === 'AbortError') {
                showStatus('⏰ 请求超时或已取消 — 如频繁出现请尝试缩短查询内容', 'error');
            } else if (error.message.includes('Failed to fetch')) {
                showStatus('❌ 网络请求失败：请检查网络连接，或确认是否在本地服务器环境下运行（直接打开 HTML 文件可能触发跨域限制）', 'error');
                resultContent.innerHTML = `<p style="color:var(--c-title-8); text-align:center;"><b>网络错误</b><br>浏览器阻止了跨域请求。请使用 Live Server 或部署到线上环境运行。</p>`;
            } else {
                showStatus(`❌ 解析失败: ${error.message}`, 'error');
                resultContent.innerHTML = `<p style="color:var(--c-title-8); text-align:center;">生成中断，请检查设置或网络。<br><small>${escapeHtml(error.message)}</small></p>`;
            }
        } finally {
            searchBtn.disabled = false;
            abortController = null;
        }
    }

    // ======== 文本清洗与格式化 ========
    function stripOpeningFluff(markdown) {
        const fluffPatterns = [
            /^好的[，,]\s*请查收[您你]对[「「"“”]*.*?[」」"“”]*的[详细]*解析[。.！!]?\s*/i,
            /^好的[，,]以下是[「「"“”]*.*?[」」"“”]*的[详细]*解析[：:]?\s*/i,
            /^请查收[您你]对[「「"“”]*.*?[」」"“”]*的[详细]*解析[。.！!]?\s*/i,
            /^以下是[「「"“”]*.*?[」」"“”]*的[详细]*解析[：:]?\s*/i,
            /^下面[是为给][您你]解析[「「"“”]*.*?[「」"“”]*[：:]?\s*/i,
            /^为您解析[「「"“”]*.*?[」」"“”]*[：:]?\s*/i,
            /^好的[，,]?\s*这是[「「"“”]*.*?[」」"“”]*的[详细]*解析[。.！!]?\s*/i,
            /^没问题[，,]?\s*以下是[「「"“”]*.*?[」」"“”]*的解析[：:]?\s*/i,
            /^当然[，,]?\s*以下是[「「"“”]*.*?[」」"“”]*的解析[：:]?\s*/i,
            /^这是一个[关于]*[「「"“”]*.*?[」」"“”]*的[详细]*解析[：:]?\s*/i,
            /^Here\s+is\s+(the\s+)?(detailed\s+)?analysis\s+of\s+[「「"“”]*.*?[」」"“”]*[.:]?\s*/i,
            /^Sure[!,]?\s*(here\s+is\s+)?(the\s+)?(detailed\s+)?analysis\s+of\s+[「「"“”]*.*?[」」"“”]*[.:]?\s*/i,
            /^Of\s+course[!,]?\s*(here\s+is\s+)?(the\s+)?analysis\s+of\s+[「「"“”]*.*?[」」"“”]*[.:]?\s*/i,
            /^Certainly[!,]?\s*(here\s+is\s+)?(the\s+)?analysis\s+of\s+[「「"“”]*.*?[」」"“”]*[.:]?\s*/i,

    function applyExamTags(html) {

            const tagged = h1Content.replace(
                /(四级|六级|雅思|托福|考研|核心词|高频词)/g,
                (match) => {
                    const classMap = {
                        '四级': 'tag-cet4', '六级': 'tag-cet6',
                        '雅思': 'tag-ielts', '托福': 'tag-toefl',
                        '考研': 'tag-ky', '核心词': 'tag-core', '高频词': 'tag-core',
                    };
                    const cls = classMap[match] || '';
                    return `<span class="exam-tag ${cls}">${match}</span>`;

            );
            return `<h1>${tagged}</h1>`;

    function applyTitleColors(html) {
        const sectionTitles = [
            '音标', '中文释义', '辅助记忆', '典型短语', '派生词',
            '形近词辨析', '同义词', '反义词', '易混词专项辨析', '例句',
            // 中文→英文翻译模式的新增板块标题
            '核心词义', '同义词族', '使用场景辨析',
            '日常口语', '书面正式', '文学雅致', '高级表达', '专业术语',
            '直译', '意译', '地道英语对应', '创意变体', '精选例句',
            '原句理解', '翻译矩阵', '词汇点睛', '翻译策略点评',
            '口语化翻译', '书面化翻译', '学术化翻译', '文学化翻译',
            '场景例句', '翻译版本', '同义词罗盘', '译法多解', '译境探索',
        ];
        let result = html;

        // 第一步：给 <strong> 中的板块标题着色（英文模式的主力）
        sectionTitles.forEach((title, index) => {
            const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`<strong>(${escaped})</strong>`, 'g');
            result = result.replace(regex, `<strong class="title-${index + 1}">$1</strong>`);
        });

        // 第二步：给 <h2> / <h3> 也分配 title-X 类（中文模式的 ## / ### 标题）
        // 从 sectionTitles.length+1 起编号，避免与上面冲突
        let hIndex = sectionTitles.length;
        result = result.replace(/<h2>/g, function () { hIndex++; return '<h2 class="title-' + hIndex + '">'; });
        result = result.replace(/<h3>/g, function () { hIndex++; return '<h3 class="title-' + hIndex + '">'; });

        return result;
    }

    // 修复 markdown 标题：确保 # / ## 前有换行，防止渲染为普通文本
    function fixMarkdownHeadings(md) {
        // 非行首的 # 或 ##（前面是非换行字符）→ 前面插入换行
        return md.replace(/([^\n])(#{1,6}\s)/g, '$1\n$2');
    }

    // 折叠连续重复行：防止 AI 在某个板块反复输出相同内容
    function collapseRepeatedLines(markdown) {
        const lines = markdown.split('\n');
        if (lines.length < 5) return markdown;

        const result = [];
        let repeatCount = 0;
        const MAX_REPEAT = 3; // 同一内容最多连续出现 3 次

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            const trimmed = line.trim();

            // 跳过空行，不参与重复检测
            if (!trimmed) {
                result.push(line);
                repeatCount = 0;
                continue;
            }

            // 检查与上一行是否内容高度相似
            const prevLine = result.length > 0 ? result[result.length - 1].trim() : '';
            if (prevLine && trimmed === prevLine) {
                repeatCount++;
                if (repeatCount >= MAX_REPEAT) {
                    // 超过阈值：跳过此行，并在第一次时插入提示
                    if (repeatCount === MAX_REPEAT) {
                        result.push('> ⚠️ *（AI 重复输出已自动折叠，避免内容冗余）*');
                    }
                    continue;
                }
            } else {
                repeatCount = 0;
            }

            result.push(line);
        }

        return result.join('\n');
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

        if (!resultContent) return;
        const textContent = resultContent.innerText.replace('正在连接 AI 引擎...', '');

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textContent)
                .then(() => showCopyFeedback())
                .catch(() => fallbackCopy(textContent));

            fallbackCopy(textContent);

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        try {
            document.execCommand('copy');
            showCopyFeedback();
        } catch {
            showStatus('⚠️ 复制失败，请手动选择文字复制', 'error');
        }
        document.body.removeChild(textarea);
    }

    function showCopyFeedback() {
        const btns = document.querySelectorAll('.result-toolbar .btn-secondary');
        btns.forEach(btn => {
            if (btn.innerText.includes('复制')) {
                const originalText = btn.innerText;
                btn.innerText = '✅ 已复制!';
                btn.style.color = '#30b54e';
                btn.style.borderColor = '#30b54e';
                btn.style.transform = 'scale(1.06)';
                btn.style.transition = 'all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
                setTimeout(() => {
                    btn.style.transform = 'scale(1)';
                }, 300);
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.color = '';
                    btn.style.borderColor = '';
                    btn.style.transform = '';
                    btn.style.transition = '';
                }, 2000);
            }
        });
    }

    // ======== 目录导航 (TOC) ========
    let tocObserver = null;
    const TOC_SIDE_KEY = 'toc_side_v9';

    function getTocSide() {
        return localStorage.getItem(TOC_SIDE_KEY) || 'right';
    }

    function applyTocSide() {
        const sidebar = document.getElementById('tocSidebar');
        const saved = getTocSide();
        if (saved === 'left') {
            sidebar.classList.add('left');
        } else {
            sidebar.classList.remove('left');
        }
        updateArrowIcon(saved);
    }

    // ======== 拖动目录侧边栏 ========
    let tocDrag = null; // { startX, startY, startLeft, startTop, sidebar, moved }

    function initTocDrag() {
        const sidebar = document.getElementById('tocSidebar');
        sidebar.addEventListener('pointerdown', onTocDragStart);
        document.addEventListener('pointermove', onTocDragMove, { passive: false });
        document.addEventListener('pointerup', onTocDragEnd);
        document.addEventListener('pointercancel', onTocDragEnd);
        // 防止移动端页面随拖拽滚动
        sidebar.addEventListener('touchstart', function(e) {
            if (e.target.closest('.toc-item') || e.target.closest('.toc-edge-arrow')) return;
        }, { passive: false });
    }

    function getSidebarLeft() {
        const sidebar = document.getElementById('tocSidebar');
        return sidebar.getBoundingClientRect().left;
    }

    function getSidebarTop() {
        const sidebar = document.getElementById('tocSidebar');
        return sidebar.getBoundingClientRect().top;
    }

    function onTocDragStart(e) {
        const sidebar = document.getElementById('tocSidebar');
        if (!sidebar.classList.contains('visible')) return;
        // 点击目录条目、箭头按钮时不触发拖拽（标题栏也可拖拽）
        if (e.target.closest('.toc-item') || e.target.closest('.toc-edge-arrow')) return;

        // 只响应主按钮（左键/单指触摸）
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        const rect = sidebar.getBoundingClientRect();
        tocDrag = {
            startX: e.clientX,
            startY: e.clientY,
            startLeft: rect.left,
            startTop: rect.top,
            sidebar: sidebar,
            moved: false
        };

        // 冻结过渡，准备跟随鼠标
        sidebar.style.transition = 'none';
        sidebar.style.cursor = 'grabbing';
        sidebar.style.boxShadow = 'var(--shadow-xl), 0 0 0 2px var(--c-title-2)';
        sidebar.style.userSelect = 'none';
        sidebar.style.webkitUserSelect = 'none';
        sidebar.setPointerCapture(e.pointerId);
        e.preventDefault();
        e.stopPropagation();
    }

    function onTocDragMove(e) {
        if (!tocDrag) return;
        // 检查这个事件是否属于我们的拖拽
        if (!tocDrag.sidebar.hasPointerCapture(e.pointerId)) {
            // 如果没有捕获到这个 pointer，但有 drag 状态，忽略（防御性）
            return;
        }

        const sidebar = tocDrag.sidebar;
        const deltaX = e.clientX - tocDrag.startX;
        const deltaY = e.clientY - tocDrag.startY;

        // 忽略微小移动（< 3px），防止误触发拖拽
        if (!tocDrag.moved && Math.abs(deltaX) < 3 && Math.abs(deltaY) < 3) return;
        tocDrag.moved = true;

        let newLeft = tocDrag.startLeft + deltaX;
        let newTop = tocDrag.startTop + deltaY;

        // Y 轴：限制在视口内
        const maxTop = window.innerHeight - sidebar.offsetHeight - 16;
        newTop = Math.max(16, Math.min(maxTop, newTop));

        // X 轴：限制在视口内
        const maxLeft = window.innerWidth - sidebar.offsetWidth - 8;
        newLeft = Math.max(4, Math.min(maxLeft, newLeft));

        // 用内联样式覆盖 CSS 定位，实现跟随鼠标
        sidebar.style.left = newLeft + 'px';
        sidebar.style.right = 'auto';
        sidebar.style.top = newTop + 'px';
        sidebar.style.opacity = '0.93';
        sidebar.style.transform = 'none';

        // 实时判定：侧边栏中心是否过了视口中线
        const sidebarCenter = newLeft + sidebar.offsetWidth / 2;
        const viewportMid = window.innerWidth / 2;
        const snapLeft = sidebarCenter < viewportMid;

        // 视觉反馈：箭头方向 + 边框高亮随判定侧实时变化
        const btn = document.getElementById('tocEdgeArrow');
        if (snapLeft) {
            btn.textContent = '▶';
            btn.style.background = 'rgba(224,142,11,0.18)';
            btn.style.borderColor = 'var(--c-title-2)';
            btn.style.color = 'var(--c-title-2)';
            sidebar.style.boxShadow = 'var(--shadow-xl), 0 0 0 2px var(--c-title-2), -10px 0 24px rgba(224,142,11,0.18)';
        } else {
            btn.textContent = '◀';
            btn.style.background = 'rgba(224,142,11,0.18)';
            btn.style.borderColor = 'var(--c-title-2)';
            btn.style.color = 'var(--c-title-2)';
            sidebar.style.boxShadow = 'var(--shadow-xl), 0 0 0 2px var(--c-title-2), 10px 0 24px rgba(224,142,11,0.18)';
        }
    }

    function onTocDragEnd(e) {
        if (!tocDrag) return;
        const sidebar = tocDrag.sidebar;

        // 释放指针捕获
        try { sidebar.releasePointerCapture(e.pointerId); } catch (_) {}

        // 如果没移动过（只是点击），直接清理状态
        if (!tocDrag.moved) {
            sidebar.style.transition = '';
            sidebar.style.left = '';
            sidebar.style.right = '';
            sidebar.style.top = '';
            sidebar.style.opacity = '';
            sidebar.style.transform = '';
            sidebar.style.boxShadow = '';
            sidebar.style.cursor = '';
            sidebar.style.userSelect = '';
            sidebar.style.webkitUserSelect = '';
            const btn = document.getElementById('tocEdgeArrow');
            btn.style.background = '';
            btn.style.borderColor = '';
            btn.style.color = '';
            tocDrag = null;
            return;
        }

        const rect = sidebar.getBoundingClientRect();
        const sidebarCenter = rect.left + rect.width / 2;
        const viewportMid = window.innerWidth / 2;

        // 放手那一刻判定：侧边栏中心是否过了视口中线
        const snapLeft = sidebarCenter < viewportMid;

        // 更新 class
        if (snapLeft) {
            sidebar.classList.add('left');
        } else {
            sidebar.classList.remove('left');
        }
        updateArrowIcon(snapLeft ? 'left' : 'right');
        localStorage.setItem(TOC_SIDE_KEY, snapLeft ? 'left' : 'right');

        // 弹簧吸附动画：用显式像素值替代 auto，确保 CSS transition 可插值
        const sidebarWidth = sidebar.offsetWidth;
        const pageWidth = 880;
        const cssOffset = Math.max(16, (window.innerWidth - pageWidth) / 2 - 200);
        let targetLeft;
        if (snapLeft) {
            targetLeft = cssOffset;                          // 左侧：left 直接使用偏移量
        } else {
            targetLeft = window.innerWidth - sidebarWidth - cssOffset; // 右侧：left = 视口宽 - 面板宽 - 右侧偏移
        }

        sidebar.style.transition = 'all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1)';
        sidebar.style.left = targetLeft + 'px';
        sidebar.style.right = 'auto';
        sidebar.style.top = '120px';          // CSS 固定值，设为像素确保可插值
        sidebar.style.opacity = '';
        sidebar.style.transform = '';
        sidebar.style.boxShadow = '';
        sidebar.style.cursor = '';
        sidebar.style.userSelect = '';
        sidebar.style.webkitUserSelect = '';

        // 恢复箭头样式
        const btn = document.getElementById('tocEdgeArrow');
        btn.style.background = '';
        btn.style.borderColor = '';
        btn.style.color = '';

        setTimeout(function() {
            // 动画结束后清除内联定位，交还 CSS class 控制
            sidebar.style.transition = '';
            sidebar.style.left = '';
            sidebar.style.right = '';
            sidebar.style.top = '';
        }, 600);

        tocDrag = null;
    }

    function updateArrowIcon(side) {
        const btn = document.getElementById('tocEdgeArrow');
        if (side === 'left') {
            btn.textContent = '▶';
            btn.title = '拖到右侧 或 点击切换';
            btn.setAttribute('aria-label', '切换到右侧');
        } else {
            btn.textContent = '◀';
            btn.title = '拖到左侧 或 点击切换';
            btn.setAttribute('aria-label', '切换到左侧');
        }
    }

    // 点击箭头快速切换到另一侧 — 飞越屏幕中央的穿梭动画
    function toggleTocSide() {
        const sidebar = document.getElementById('tocSidebar');
        if (tocDrag) return;

        const current = sidebar.classList.contains('left') ? 'left' : 'right';
        const next = current === 'right' ? 'left' : 'right';

        // 1️⃣ 记录动画前侧边栏在屏幕上的实际位置
        const oldRect = sidebar.getBoundingClientRect();

        // 2️⃣ 冻结动画 + 切换 class（无过渡，瞬间跳到新位置）
        sidebar.style.transition = 'none';
        sidebar.style.pointerEvents = 'none';
        if (next === 'left') {
            sidebar.classList.add('left');
        } else {
            sidebar.classList.remove('left');
        }
        updateArrowIcon(next);

        // 3️⃣ 获取 class 切换后侧边栏在屏幕上的新位置
        const newRect = sidebar.getBoundingClientRect();

        // 4️⃣ 计算从旧位置到新位置的位移差
        const deltaX = oldRect.left - newRect.left;
        const deltaY = oldRect.top - newRect.top;

        // 5️⃣ 用 transform 把侧边栏"拽回"旧位置（视觉上还在原处）
        sidebar.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.92)`;
        sidebar.style.opacity = '0.7';

        // 6️⃣ 强制重排，确保浏览器提交上面的样式
        void sidebar.offsetHeight;

        // 7️⃣ 启动飞越动画：侧边栏穿梭过屏幕，弹簧着陆
        sidebar.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.85, 0.35, 1.02), opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
        sidebar.style.transform = 'translate(0, 0) scale(1)';
        sidebar.style.opacity = '1';
        sidebar.style.pointerEvents = 'auto';

        // 8️⃣ 动画完成后清理内联样式，交还 CSS 控制
        setTimeout(function() {
            sidebar.style.transition = '';
            sidebar.style.transform = '';
            sidebar.style.opacity = '';
            sidebar.style.pointerEvents = '';
        }, 650);

        localStorage.setItem(TOC_SIDE_KEY, next);
    }

    function buildTOC() {
        const resultContent = document.getElementById('resultContent');
        const sidebar = document.getElementById('tocSidebar');
        const tocList = document.getElementById('tocList');
        const tocListMobile = document.getElementById('tocListMobile');
        const tocToggle = document.getElementById('tocToggle');

        // 清除旧目录
        tocList.innerHTML = '';
        tocListMobile.innerHTML = '';
        if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }

        // 扫描所有板块标题
        // 优先匹配 <strong> 中的标题（英文模式的主力），
        // 若无则回退到 <h2>/<h3>（中文翻译模式，AI 输出 ##/### 标题）
        let headings = resultContent.querySelectorAll('strong[class^="title-"]');
        if (headings.length === 0) {
            headings = resultContent.querySelectorAll('h2[class^="title-"], h3[class^="title-"]');
        }
        if (headings.length === 0) {
            sidebar.classList.remove('visible');
            tocToggle.classList.remove('visible');
            return;
        }

        headings.forEach((heading, i) => {
            // 注入锚点 ID
            const id = 'sec-' + (i + 1);
            heading.id = id;

            const text = heading.textContent.trim();
            if (!text) return;

            // 桌面侧边栏条目
            const item = document.createElement('button');
            item.className = 'toc-item';
            item.textContent = (i + 1) + '. ' + text;
            item.setAttribute('data-target', id);
            item.onclick = function() {
                scrollToSection(id);
            };
            tocList.appendChild(item);

            // 移动端条目
            const itemM = document.createElement('button');
            itemM.className = 'toc-item';
            itemM.textContent = (i + 1) + '. ' + text;
            itemM.setAttribute('data-target', id);
            itemM.onclick = function() {
                scrollToSection(id);
                closeTocOverlay();
            };
            tocListMobile.appendChild(itemM);
        });

        // 显示侧边栏 / 移动按钮
        if (window.innerWidth > 1100) {
            sidebar.classList.add('visible');
            applyTocSide();
            tocToggle.classList.remove('visible');
        } else {
            sidebar.classList.remove('visible');
            tocToggle.classList.add('visible');
        }

        // 滚动监听 (IntersectionObserver)
        tocObserver = new IntersectionObserver(function(entries) {
            // 收集所有当前可见的标题
            const visible = entries.filter(function(e) { return e.isIntersecting; });
            if (visible.length === 0) return;

            // 取最靠上的那个
            visible.sort(function(a, b) {
                return a.boundingClientRect.top - b.boundingClientRect.top;
            });
            const activeId = visible[0].target.id;

            // 高亮对应条目
            [tocList, tocListMobile].forEach(function(list) {
                list.querySelectorAll('.toc-item').forEach(function(item) {
                    if (item.getAttribute('data-target') === activeId) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            });
        }, {
            rootMargin: '-80px 0px -60% 0px',
            threshold: 0
        });

        headings.forEach(function(h) {
            tocObserver.observe(h);
        });

        // 初始高亮第一个
        if (tocList.firstChild) tocList.firstChild.classList.add('active');
        if (tocListMobile.firstChild) tocListMobile.firstChild.classList.add('active');
    }

    function scrollToSection(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // 短暂高亮
        el.style.transition = 'background 0.3s';
        el.style.background = 'var(--clickable-bg)';
        setTimeout(function() { el.style.background = ''; }, 1200);
    }

    function closeTocOverlay(e) {
        if (e && e.target !== document.getElementById('tocOverlay')) return;
        document.getElementById('tocOverlay').classList.remove('show');
    }

    function openTocOverlay() {
        document.getElementById('tocOverlay').classList.add('show');
    }

    // 移动端目录按钮点击
    document.getElementById('tocToggle').addEventListener('click', openTocOverlay);

    // 窗口尺寸变化时更新 TOC 显示模式
    window.addEventListener('resize', function() {
        var sidebar = document.getElementById('tocSidebar');
        var toggle = document.getElementById('tocToggle');
        var tocList = document.getElementById('tocList');
        if (tocList.children.length === 0) return; // 无内容时不动
        if (window.innerWidth > 1100) {
            sidebar.classList.add('visible');
            applyTocSide();
            toggle.classList.remove('visible');
        } else {
            sidebar.classList.remove('visible');
            toggle.classList.add('visible');
        }
    });
</script>
</body>
</html>
